<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동작 흐름 위젯 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#ffffff; --fg:#37352f; --muted:#7b7872; --line:#ededec;
  --code-bg:#f7f6f3; --radius:10px;
  --font:'Pretendard',-apple-system,sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;
}
body{margin:0;font-family:var(--font);color:var(--fg);background:var(--bg);
  line-height:1.65;-webkit-font-smoothing:antialiased;padding:40px;max-width:860px;margin:0 auto;}
h1{font-size:20px;}
.demo-label{color:var(--muted);font-size:13px;margin:30px 0 8px;font-weight:700;}

/* ============================================================
   동작 흐름 위젯 — 입력을 고르면 파이프라인을 따라 흐르며 결과까지
   특징 3개(RMS·ZCR·crest) + 실제 k-NN(다수결)을 JS로 시연.
   self-contained vanilla JS. 교재 밝은 테마.
   ============================================================ */
.flow{border:1px solid var(--line);border-radius:12px;background:#fff;margin:16px 0;
  max-width:760px;overflow:hidden;--ac:#0891B2;}
.flow-top{padding:14px 16px;background:var(--code-bg);border-bottom:1px solid var(--line);}
.flow-tt{font-size:13px;font-weight:800;margin-bottom:10px;}
.flow-tt small{font-weight:500;color:var(--muted);margin-left:6px;}
.flow-pick{display:flex;gap:8px;flex-wrap:wrap;}
.flow-btn{appearance:none;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:var(--fg);border-radius:99px;
  padding:8px 15px;display:flex;align-items:center;gap:6px;transition:.15s;}
.flow-btn:hover{border-color:var(--ac);}
.flow-btn[aria-pressed="true"]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,#fff);color:var(--ac);}
.flow-btn .k{font-size:16px;}

.flow-body{padding:16px;}
.flow-hint{text-align:center;color:var(--muted);font-size:13px;padding:24px 0;}

.fstep{position:relative;display:flex;gap:13px;padding:0 0 6px;opacity:.38;transition:opacity .35s;}
.fstep.lit{opacity:1;}
.fstep:not(:last-child) .fstep-rail::after{content:"";position:absolute;left:18px;top:38px;bottom:-6px;
  width:2px;background:var(--line);}
.fstep.lit:not(:last-child) .fstep-rail::after{background:color-mix(in srgb,var(--ac) 45%,var(--line));}
.fstep-rail{position:relative;flex-shrink:0;}
.fstep-ico{width:38px;height:38px;border-radius:11px;background:var(--code-bg);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;transition:.35s;}
.fstep.lit .fstep-ico{background:color-mix(in srgb,var(--ac) 12%,#fff);border-color:color-mix(in srgb,var(--ac) 40%,var(--line));
  transform:scale(1.06);}
.fstep-main{flex:1;min-width:0;padding-top:2px;}
.fstep-nm{font-size:13.5px;font-weight:800;}
.fstep-nm small{font-weight:500;color:var(--muted);margin-left:6px;font-size:11.5px;}
.fstep-data{margin-top:5px;font-size:12.5px;color:#55524c;background:var(--code-bg);
  border:1px solid var(--line);border-radius:8px;padding:8px 11px;
  opacity:0;transform:translateY(-4px);transition:.35s;line-height:1.7;}
.fstep.lit .fstep-data{opacity:1;transform:none;}
.fstep-data b{color:var(--fg);} .fstep-data code{font-family:var(--mono);font-size:11.5px;
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;}
.feat{display:inline-block;margin:2px 10px 2px 0;}
.feat .v{font-family:var(--mono);font-weight:700;color:var(--fg);}
.feat.hl .v{color:var(--ac);}
/* k-NN 이웃 행 (다수결) */
.fnb{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:11.5px;}
.fnb-tag{font-family:var(--mono);font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;min-width:48px;text-align:center;}
.fnb-d{font-family:var(--mono);color:var(--muted);font-size:10.5px;width:54px;}
.fnb-w{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden;max-width:160px;}
.fnb-w i{display:block;height:100%;border-radius:99px;}
.fvote{margin-top:7px;font-size:12px;padding-top:6px;border-top:1px dashed var(--line);}
.fgauge{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 4px;}
.fgauge i{display:block;height:100%;border-radius:99px;transition:width .5s;}
.fthresh{font-size:11px;color:var(--muted);}
.fout{border-radius:10px;padding:13px 15px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;
  opacity:0;transform:translateY(6px);transition:.4s;}
.fstep.lit .fout{opacity:1;transform:none;}
.fout.say{background:#f0faf4;border:1px solid #bbf7d0;color:#16a34a;}
.fout.mute{background:#f7f6f3;border:1px dashed #d8d4cc;color:var(--muted);}
.fout .big{font-size:22px;}
.fled{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.04);}
.freplay{margin-top:4px;font-size:12px;color:var(--ac);background:none;border:none;cursor:pointer;font-weight:700;font-family:var(--font);}
</style>
</head>
<body>
<h1>🔄 동작 흐름 위젯 프로토타입 v2 — 특징 3개 · k-NN(다수결)</h1>
<p style="color:var(--muted);font-size:13.5px;">소리를 고르면 <b>듣기 → 특징 3개 → 정규화 → k-NN(다수결) → 확신 → 출력</b>을 따라 흐릅니다. 가장 가까운 이웃 5개에게 물어, 다수결로 답을 정해요.</p>

<div class="demo-label">소리 분류 + MP3 출력 — 전체 AI 한 사이클</div>
<div class="flow" data-ac="#7C3AED"></div>

<script>
/* 입력 예시 — 우리 실제 코드(features→norm→predict)와 같은 구조.
   neighbors = [라벨, 색, 정규화공간에서의 거리]. 확신도는 다수결 비율로 계산. */
const INPUTS = {
  whistle:{ k:"🎤", label:"휘파람",
    rms:3200, zcr:540, crest:3.1, norm:[0.72,0.88,0.22],
    note:"이어지는 맑은 톤 → 높낮이(ZCR) 큼, 들쭉날쭉(crest) 작음",
    neighbors:[["휘파람","#06b6d4",0.06],["휘파람","#06b6d4",0.09],["휘파람","#06b6d4",0.13],["휘파람","#06b6d4",0.18],["박수","#22c55e",0.41]],
    speak:"휘파람이에요", led:"#06b6d4" },
  clap:{ k:"👏", label:"박수",
    rms:9800, zcr:120, crest:9.2, norm:[0.96,0.12,0.95],
    note:"순간 ‘탁!’ → 크기(RMS) 큼, 들쭉날쭉(crest) 매우 큼",
    neighbors:[["박수","#22c55e",0.05],["박수","#22c55e",0.07],["박수","#22c55e",0.10],["박수","#22c55e",0.12],["박수","#22c55e",0.19]],
    speak:"박수네요", led:"#22c55e" },
  unknown:{ k:"🤔", label:"애매한 소리(헛기침)",
    rms:2100, zcr:300, crest:4.0, norm:[0.40,0.45,0.35],
    note:"이도 저도 아닌 중간값 → 이웃이 여러 종류로 갈림",
    neighbors:[["휘파람","#06b6d4",0.22],["박수","#22c55e",0.21],["말소리","#f59e0b",0.24],["박수","#22c55e",0.25],["휘파람","#06b6d4",0.23]],
    speak:null, led:null },
};
const CONF_MIN = 60;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* k-NN 다수결 — sound_predict.py의 vote += 1 그대로 */
function knn(neighbors){
  const vote={}, colorOf={};
  let total=0;
  neighbors.forEach(([nm,c])=>{ vote[nm]=(vote[nm]||0)+1; colorOf[nm]=c; total+=1; });
  const ranked=Object.entries(vote).sort((a,b)=>b[1]-a[1]);
  const [best,bw]=ranked[0];
  return { best, color:colorOf[best], conf:Math.round(bw/total*100), ranked, total, colorOf };
}

function buildFlow(el){
  const ac = el.dataset.ac || "#0891B2";
  el.style.setProperty("--ac", ac);
  el.innerHTML = `
    <div class="flow-top">
      <div class="flow-tt">🔄 소리 하나가 목소리가 되기까지<small>버튼을 눌러보세요</small></div>
      <div class="flow-pick">
        ${Object.entries(INPUTS).map(([id,v])=>
          `<button class="flow-btn" data-in="${id}" aria-pressed="false"><span class="k">${v.k}</span>${esc(v.label)}</button>`).join("")}
      </div>
    </div>
    <div class="flow-body"><div class="flow-hint">위에서 소리를 하나 고르면 흐름이 시작돼요 👆</div></div>`;
  const body = el.querySelector(".flow-body");

  function render(inp){
    const R = knn(inp.neighbors);
    const pass = R.conf >= CONF_MIN;
    const voteStr = R.ranked.map(([nm,w])=>`${nm} ${Math.round(w/R.total*100)}%`).join(" · ");

    const steps = [
      {ic:"🎤", nm:"듣기", sub:"마이크 입력",
       data:`마이크가 <b>0.1초</b> 동안 소리를 <b>1600번</b> 측정해 한 덩어리로 잡아요.`},
      {ic:"📊", nm:"특징 추출", sub:"숫자 3개로",
       data:`<span class="feat">크기(RMS) <span class="v">${inp.rms}</span></span>
             <span class="feat">높낮이(ZCR) <span class="v">${inp.zcr}</span></span>
             <span class="feat hl">들쭉날쭉(crest) <span class="v">${inp.crest}</span></span>
             <br><span style="color:var(--muted)">${esc(inp.note)}</span>`},
      {ic:"⚖️", nm:"정규화", sub:"세 특징 0~1로",
       data:`<code>[${inp.norm.join(", ")}]</code> — 범위가 다른 세 값을 <b>0~1</b>로 맞춰 공평하게 비교해요.`},
      {ic:"🧠", nm:"k-NN", sub:"가장 가까운 5개에게 물어보기",
       data:`가장 가까운 이웃 5개 — <b>가까운 순서대로</b>:
             ${inp.neighbors.slice().sort((a,b)=>a[2]-b[2]).map(([nm,c,d])=>{
               return `<div class="fnb"><span class="fnb-tag" style="background:${c}">${esc(nm)}</span>
                 <span class="fnb-d">d=${d.toFixed(2)}</span></div>`;
             }).join("")}
             <div class="fvote">다수결 → <b>${voteStr}</b></div>`},
      {ic: pass?"✅":"🤫", nm:"확신도 판정", sub:`기준 ${CONF_MIN}%`,
       data:`<div class="fgauge"><i style="width:${R.conf}%;background:${pass?'#22c55e':'#f97316'}"></i></div>
             확신 <b>${R.conf}%</b> — ${pass?`기준(${CONF_MIN}%) <b style="color:#16a34a">통과</b> → 말한다`:`기준 미만 <b style="color:#ea580c">→ 침묵</b>`}
             <div class="fthresh">${pass?"이웃이 가까이 한쪽으로 모였어요.":"이웃이 갈리고 멀어서 자신이 없어요. 틀리게 말하느니 조용히!"}</div>`},
      {ic:"🔊", nm:"출력", sub:"LED + 음성",
       out: pass
         ? `<div class="fout say"><span class="fled" style="background:${R.color}"></span>
            <span>🔊 <span class="big">“${esc(inp.speak)}”</span></span></div>`
         : `<div class="fout mute"><span class="big">🤫</span><span>아무 말도 하지 않아요 — “잘 모르겠어요”</span></div>`},
    ];

    body.innerHTML = steps.map((s,i)=>`
      <div class="fstep" data-i="${i}">
        <div class="fstep-rail"><div class="fstep-ico">${s.ic}</div></div>
        <div class="fstep-main">
          <div class="fstep-nm">${s.nm}<small>${s.sub}</small></div>
          ${s.out ? s.out : `<div class="fstep-data">${s.data}</div>`}
        </div>
      </div>`).join("") + `<button class="freplay">↻ 다시 보기</button>`;

    const nodes = body.querySelectorAll(".fstep");
    nodes.forEach((n,i)=>setTimeout(()=>n.classList.add("lit"), 120 + i*430));
    body.querySelector(".freplay").onclick=()=>render(inp);
  }

  el.querySelectorAll(".flow-btn").forEach(btn=>btn.onclick=()=>{
    el.querySelectorAll(".flow-btn").forEach(b=>b.setAttribute("aria-pressed", b===btn));
    render(INPUTS[btn.dataset.in]);
  });
}
document.querySelectorAll(".flow").forEach(buildFlow);
</script>
</body>
</html>
