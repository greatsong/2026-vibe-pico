<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>코드 라이브러리 · 연수</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --ok:#22c55e; --new:#f59e0b; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
  nav{display:flex;gap:8px;margin-bottom:14px}
  nav a{flex:1;text-align:center;padding:9px;border-radius:10px;background:var(--card);
    color:var(--muted);text-decoration:none;font-weight:600;font-size:.9rem;border:1px solid var(--line)}
  nav a.active{background:var(--accent2);color:#02121f;border-color:var(--accent2)}
  h1{font-size:1.3rem;margin:.2em 0 .1em}
  .sub{color:var(--muted);font-size:.9rem;margin-top:0}
  .keybar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:14px 0}
  label{display:block;font-weight:600;margin-bottom:.35em;font-size:.9rem}
  input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px;font-size:1rem}
  input:focus{outline:2px solid var(--accent)}
  .hint{color:var(--muted);font-size:.82rem;margin:.4em 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin:14px 0;position:relative}
  .card.latest{border-color:var(--new);box-shadow:0 0 0 1px var(--new)}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .num{background:var(--card2);border:1px solid var(--line);border-radius:8px;
    font-weight:800;padding:2px 10px;font-size:.85rem;color:var(--accent)}
  .title{font-weight:700;font-size:1rem;flex:1;min-width:120px}
  .meta{color:var(--muted);font-size:.78rem}
  .badge-new{background:var(--new);color:#02121f;font-weight:800;border-radius:999px;
    padding:2px 10px;font-size:.74rem;letter-spacing:.02em}
  pre{margin:0;overflow-x:auto;background:#020617;border:1px solid var(--line);border-radius:10px;
    padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;color:#cbd5e1;white-space:pre}
  button{cursor:pointer;border:none;border-radius:9px;padding:8px 14px;font-size:.85rem;font-weight:700;
    background:var(--accent2);color:#02121f}
  button.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:600}
  button.done{background:var(--ok)}
  .cardfoot{display:flex;justify-content:flex-end;margin-top:10px}
  footer{color:var(--muted);font-size:.78rem;text-align:center;margin-top:30px}
  .empty{color:var(--muted);text-align:center;padding:30px}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="index.html">🔑 키 받기</a>
    <a href="guide.html">📖 안내</a>
    <a href="codes.html" class="active">📋 코드</a>
  </nav>

  <h1>📋 코드 라이브러리</h1>
  <p class="sub">수업에서 사용하는 코드 모음입니다. <b>위쪽일수록 최신</b>이며, 맨 위 🆕 가 가장 최근 코드입니다.</p>

  <div class="keybar">
    <label>내 API 키 (선택) — 입력하면 아래 코드의 <code>{{API_KEY}}</code> 가 자동으로 채워집니다</label>
    <input id="mykey" type="text" placeholder="여기에 키 붙여넣기 (이 기기에만 저장됨)" autocomplete="off" spellcheck="false">
    <p class="hint">비워두면 <code>{{API_KEY}}</code> 자리표시자로 표시됩니다. 저장 위치: 이 브라우저(localStorage).</p>
  </div>

  <div id="list"></div>

  <footer>
    코드는 강사가 수시로 추가합니다 · 새로고침하면 최신 코드가 보입니다<br>
    키는 각자 기기에만 저장되며 서버로 전송되지 않습니다.
  </footer>
</div>

<script src="codes.js"></script>
<script>
"use strict";
const $ = s=>document.querySelector(s);
const LS_KEY = "keyshare.studentkey.v1";

function getKey(){ return localStorage.getItem(LS_KEY) || ""; }
function fill(code, key){ return (code||"").replaceAll("{{API_KEY}}", key || "여기에_키_입력"); }

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    document.body.removeChild(ta); return ok;
  }
}

function render(){
  const list = $("#list");
  const codes = (window.CODES || []).slice();
  if(!codes.length){ list.innerHTML='<div class="empty">아직 등록된 코드가 없습니다.</div>'; return; }
  // 최신 = n 이 가장 큰 것. 내림차순 정렬(위쪽일수록 최신).
  codes.sort((a,b)=> (b.n||0) - (a.n||0));
  const latestN = codes[0].n;
  const key = getKey();
  list.innerHTML = "";
  codes.forEach(c=>{
    const filled = fill(c.code, key);
    const isLatest = c.n === latestN;
    const card = document.createElement("div");
    card.className = "card" + (isLatest ? " latest" : "");
    card.innerHTML = `
      <div class="top">
        <span class="num">#${c.n??"?"}</span>
        <span class="title"></span>
        ${isLatest ? '<span class="badge-new">🆕 최신</span>' : ''}
        <span class="meta"></span>
      </div>
      <pre></pre>
      <div class="cardfoot"><button class="copybtn">📋 복사</button></div>`;
    card.querySelector(".title").textContent = c.title || "코드";
    card.querySelector(".meta").textContent = `${c.lang||""} · ${c.date||""}`.trim();
    card.querySelector("pre").textContent = filled;
    const btn = card.querySelector(".copybtn");
    btn.addEventListener("click", async ()=>{
      if(await copyText(filled)){
        btn.textContent="✅ 복사됨"; btn.classList.add("done");
        setTimeout(()=>{ btn.textContent="📋 복사"; btn.classList.remove("done"); }, 1400);
      }
    });
    list.appendChild(card);
  });
}

$("#mykey").value = getKey();
$("#mykey").addEventListener("input", e=>{
  localStorage.setItem(LS_KEY, e.target.value.trim());
  render();
});
render();
</script>
</body>
</html>
