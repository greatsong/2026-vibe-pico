<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>연수 안내 · API 키 받기</title>
<style>
  body{margin:0;background:#0f172a;color:#e2e8f0;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  nav{display:flex;gap:8px;margin-bottom:14px}
  nav a{flex:1;text-align:center;padding:9px;border-radius:10px;background:#1e293b;
    color:#94a3b8;text-decoration:none;font-weight:600;font-size:.9rem;border:1px solid #334155}
  nav a.active{background:#0ea5e9;color:#02121f;border-color:#0ea5e9}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
  button{cursor:pointer;border:none;border-radius:10px;padding:11px 16px;font-size:.95rem;font-weight:700;
    background:#0ea5e9;color:#02121f}
  button.ghost{background:#273449;color:#e2e8f0;border:1px solid #334155}
  .slidebox{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  svg{display:block;width:100%;height:auto}
  .hint{color:#94a3b8;font-size:.84rem}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="index.html">🔑 키 받기</a>
    <a href="guide.html" class="active">📖 안내</a>
    <a href="codes.html">📋 코드</a>
  </nav>

  <div class="bar">
    <button id="png">🖼️ PNG로 저장</button>
    <button class="ghost" id="print">🖨️ 인쇄</button>
    <span class="hint" style="align-self:center">슬라이드(16:9)에 그대로 넣을 수 있습니다.</span>
  </div>

  <div class="slidebox">
    <!-- ===================== 안내 슬라이드 SVG ===================== -->
    <svg id="slide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eff6ff"/>
          <stop offset="1" stop-color="#f8fafc"/>
        </linearGradient>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
        </filter>
      </defs>

      <rect width="1280" height="720" fill="url(#bg)"/>

      <!-- 제목 -->
      <text x="640" y="92" text-anchor="middle" font-size="50" font-weight="800" fill="#0f172a">🔑 연수용 API 키 받기</text>
      <text x="640" y="140" text-anchor="middle" font-size="24" fill="#64748b">아래 3단계면 끝납니다</text>

      <!-- 카드 1 : 링크 클릭 -->
      <g filter="url(#sh)">
        <rect x="60" y="210" width="360" height="300" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      </g>
      <circle cx="240" cy="290" r="40" fill="#0ea5e9"/>
      <text x="240" y="304" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">1</text>
      <!-- 커서 아이콘 -->
      <path d="M225 350 l0 52 l13 -13 l9 19 l9 -4 l-9 -19 l18 0 z" fill="#0ea5e9" stroke="#0369a1" stroke-width="2" stroke-linejoin="round"/>
      <text x="240" y="438" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">링크 클릭</text>
      <text x="240" y="470" text-anchor="middle" font-size="18" fill="#64748b">구글 문서에 있는</text>
      <text x="240" y="494" text-anchor="middle" font-size="18" fill="#64748b">링크를 누르세요</text>

      <!-- 화살표 -->
      <path d="M432 360 l26 0 m-10 -10 l10 10 l-10 10" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 카드 2 : 접근 코드 입력 -->
      <g filter="url(#sh)">
        <rect x="460" y="210" width="360" height="300" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      </g>
      <circle cx="640" cy="290" r="40" fill="#6366f1"/>
      <text x="640" y="304" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">2</text>
      <!-- 자물쇠 아이콘 -->
      <rect x="615" y="362" width="50" height="38" rx="6" fill="#6366f1"/>
      <path d="M623 362 v-10 a17 17 0 0 1 34 0 v10" fill="none" stroke="#4338ca" stroke-width="6"/>
      <circle cx="640" cy="380" r="5" fill="#ffffff"/>
      <text x="640" y="438" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">접근 코드 입력</text>
      <text x="640" y="470" text-anchor="middle" font-size="18" fill="#64748b">강사가 불러주는</text>
      <text x="640" y="494" text-anchor="middle" font-size="18" fill="#64748b">코드를 입력하세요</text>

      <!-- 화살표 -->
      <path d="M832 360 l26 0 m-10 -10 l10 10 l-10 10" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 카드 3 : 키 복사 -->
      <g filter="url(#sh)">
        <rect x="860" y="210" width="360" height="300" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      </g>
      <circle cx="1040" cy="290" r="40" fill="#22c55e"/>
      <text x="1040" y="304" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">3</text>
      <!-- 클립보드 아이콘 -->
      <rect x="1018" y="356" width="44" height="52" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
      <rect x="1030" y="350" width="20" height="12" rx="3" fill="#22c55e"/>
      <path d="M1027 378 h26 M1027 390 h26" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
      <text x="1040" y="438" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">키 복사</text>
      <text x="1040" y="470" text-anchor="middle" font-size="18" fill="#64748b">[🔓 키 보기] 누르고</text>
      <text x="1040" y="494" text-anchor="middle" font-size="18" fill="#64748b">키를 복사하세요</text>

      <!-- 접근 코드 콜아웃 -->
      <rect x="160" y="548" width="960" height="60" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <text x="640" y="586" text-anchor="middle" font-size="22" font-weight="700" fill="#92400e">🔑 접근 코드는 화면에 적지 않고, 강사가 직접 불러드립니다</text>

      <!-- 푸터 -->
      <text x="640" y="656" text-anchor="middle" font-size="18" fill="#ef4444">⚠ 연수 종료 후 키는 폐기됩니다 · 키를 외부에 공유하지 마세요</text>
      <text x="640" y="690" text-anchor="middle" font-size="15" fill="#94a3b8">greatsong.github.io/2026-vibe-pico/key_share</text>
    </svg>
    <!-- =========================================================== -->
  </div>
</div>

<script>
"use strict";
const slide = document.getElementById("slide");

function svgToBlobURL(){
  const clone = slide.cloneNode(true);
  clone.setAttribute("width","1280"); clone.setAttribute("height","720");
  const xml = new XMLSerializer().serializeToString(clone);
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

document.getElementById("png").addEventListener("click", ()=>{
  const scale = 2; // 2560x1440 고해상도
  const img = new Image();
  img.onload = ()=>{
    const canvas = document.createElement("canvas");
    canvas.width = 1280*scale; canvas.height = 720*scale;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob=>{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "연수_키받기_안내.png";
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    }, "image/png");
  };
  img.onerror = ()=>alert("이미지 변환에 실패했습니다. 인쇄(PDF로 저장)를 이용해 주세요.");
  img.src = svgToBlobURL();
});

document.getElementById("print").addEventListener("click", ()=>window.print());
</script>
</body>
</html>
